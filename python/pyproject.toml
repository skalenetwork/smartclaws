[project]
name = "smartclaws"
version = "0.5.0"
description = "SDK and CLI for the SmartClaws IoT protocol on SKALE"
requires-python = ">=3.11"
license = "LGPL-3.0-or-later"
dependencies = [
    "web3>=7.10",
    "click>=8.1",
    "bleak>=3.0.1",
]

[project.scripts]
smartclaws = "smartclaws.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartclaws"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
