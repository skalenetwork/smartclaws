<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartClaws Demo Timeline</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f3ee;
        --panel: #fffdf9;
        --ink: #17242a;
        --muted: #596a70;
        --line: #d7d1c4;
        --temp: #047b83;
        --trend: #bd3c5b;
        --price: #5b3aa6;
        --low-tier: #0f766e;
        --mid-tier: #9a6700;
        --high-tier: #b42318;
        --shelly-out: #285ea8;
        --shelly-in: #b45309;
        --master: #166534;
        --thermal: #047b83;
        --warn: #8a3412;
      }

      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.4;
        margin: 0;
      }

      button,
      input {
        font: inherit;
      }

      main {
        margin: 0 auto;
        max-width: 1600px;
        padding: 28px clamp(14px, 3vw, 40px) 48px;
      }

      header {
        align-items: end;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px 32px;
        justify-content: space-between;
        padding-bottom: 20px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(1.7rem, 2.6vw, 2.7rem);
        font-weight: 720;
      }

      h2 {
        font-size: 1.02rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .subhead {
        color: var(--muted);
        margin-top: 6px;
      }

      .window {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      .metrics {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(152px, 1fr));
        padding: 18px 0;
      }

      .metric {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        min-height: 82px;
        padding: 12px 14px;
      }

      .metric strong {
        display: block;
        font-size: 1.65rem;
        font-variant-numeric: tabular-nums;
      }

      .metric span {
        color: var(--muted);
        display: block;
        font-size: 0.86rem;
      }

      .band {
        border-top: 1px solid var(--line);
        padding: 22px 0;
      }

      .chart-shell,
      .timeline-shell {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .chart-head,
      .timeline-head {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        justify-content: space-between;
        padding: 12px 16px;
      }

      .legend {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.86rem;
        gap: 13px;
      }

      .key::before {
        background: currentColor;
        border-radius: 999px;
        content: "";
        display: inline-block;
        height: 9px;
        margin-right: 7px;
        width: 9px;
      }

      .temp-key {
        color: var(--temp);
      }

      .price-key {
        color: var(--price);
      }

      .low-key {
        color: var(--low-tier);
      }

      .mid-key {
        color: var(--mid-tier);
      }

      .high-key {
        color: var(--high-tier);
      }


      .out-key {
        color: var(--shelly-out);
      }

      .in-key {
        color: var(--shelly-in);
      }

      .master-key {
        color: var(--master);
      }

      #price-chart,
      #thermal-chart {
        display: block;
        height: min(360px, 52vh);
        min-height: 280px;
        width: 100%;
      }

      .chart-grid {
        stroke: var(--line);
        stroke-width: 1;
      }

      .chart-axis {
        fill: var(--muted);
        font-size: 12px;
      }

      .temperature-guide {
        stroke: color-mix(in srgb, var(--ink) 48%, transparent);
        stroke-dasharray: 4 5;
        stroke-width: 1.4;
      }

      .temperature-guide-label {
        fill: var(--ink);
        font-size: 12px;
        font-weight: 700;
      }

      .chart-temp {
        fill: none;
        stroke: var(--temp);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 3;
      }

      .chart-price {
        fill: none;
        stroke: var(--price);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.4;
      }

      .price-dot {
        fill: color-mix(in srgb, var(--price) 72%, var(--panel));
        opacity: 0.48;
      }

      .price-tier.low,
      .tier-segment.low {
        color: var(--low-tier);
      }

      .price-tier.medium,
      .tier-segment.medium {
        color: var(--mid-tier);
      }

      .price-tier.high,
      .tier-segment.high {
        color: var(--high-tier);
      }

      .price-tier {
        fill: currentColor;
        opacity: 0.13;
      }

      .thermal-dot {
        fill: var(--panel);
        stroke: var(--temp);
        stroke-width: 1.5;
      }

      .axis {
        border-bottom: 1px solid var(--line);
        height: 44px;
        margin-left: 132px;
        position: relative;
      }

      .axis-mark {
        border-left: 1px solid var(--line);
        bottom: 0;
        color: var(--muted);
        font-size: 0.76rem;
        height: 100%;
        left: var(--x);
        padding: 7px 0 0 7px;
        position: absolute;
        transform: translateX(-1px);
        white-space: nowrap;
      }

      .lane {
        border-bottom: 1px solid var(--line);
        display: grid;
        grid-template-columns: 132px 1fr;
        min-height: 68px;
      }

      .lane:last-child {
        border-bottom: 0;
      }

      .lane-label {
        align-content: center;
        border-right: 1px solid var(--line);
        color: var(--muted);
        display: grid;
        font-size: 0.88rem;
        gap: 2px;
        padding: 10px 12px;
      }

      .lane-label strong {
        color: var(--ink);
        font-size: 0.93rem;
      }

      .lane-plot {
        background-image: repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(20% - 1px),
          color-mix(in srgb, var(--line) 75%, transparent) calc(20% - 1px),
          color-mix(in srgb, var(--line) 75%, transparent) 20%
        );
        min-height: 68px;
        position: relative;
      }

      .tier-segment {
        background: color-mix(in srgb, currentColor 20%, var(--panel));
        border-left: 1px solid currentColor;
        border-right: 1px solid currentColor;
        color: var(--mid-tier);
        height: 40px;
        left: var(--x);
        min-width: 2px;
        overflow: hidden;
        padding: 10px 7px;
        position: absolute;
        top: 14px;
        white-space: nowrap;
        width: var(--w);
      }

      .tier-segment strong {
        color: currentColor;
        font-size: 0.84rem;
        text-transform: uppercase;
      }

      .marker {
        background: currentColor;
        border: 2px solid var(--panel);
        border-radius: 999px;
        box-shadow: 0 0 0 1px currentColor;
        color: var(--thermal);
        cursor: pointer;
        height: 13px;
        left: var(--x);
        min-height: 13px;
        min-width: 13px;
        padding: 0;
        position: absolute;
        top: var(--y);
        transform: translate(-50%, -50%);
        width: 13px;
      }

      .marker.selected {
        height: 19px;
        width: 19px;
      }

      .marker.shelly-outgoing {
        color: var(--shelly-out);
      }

      .marker.shelly-incoming {
        border-radius: 3px;
        color: var(--shelly-in);
      }

      .marker.master {
        color: var(--master);
      }

      .marker.failed {
        color: var(--warn);
      }

      .controls {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 9px 16px;
      }

      .controls label {
        align-items: center;
        color: var(--muted);
        display: inline-flex;
        gap: 6px;
        white-space: nowrap;
      }

      input[type="search"] {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        min-height: 36px;
        min-width: min(310px, 100%);
        padding: 7px 10px;
      }

      .lower {
        display: grid;
        gap: 18px;
        grid-template-columns: minmax(0, 1.6fr) minmax(300px, 0.8fr);
      }

      .table-shell,
      .detail,
      .decisions {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }

      .table-scroll {
        max-height: 720px;
        overflow: auto;
      }

      table {
        border-collapse: collapse;
        font-size: 0.89rem;
        width: 100%;
      }

      th {
        background: var(--panel);
        color: var(--muted);
        font-size: 0.76rem;
        position: sticky;
        text-align: left;
        text-transform: uppercase;
        top: 0;
        z-index: 1;
      }

      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 9px 11px;
        vertical-align: top;
      }

      tr[data-event-id] {
        cursor: pointer;
      }

      tr[data-event-id]:hover,
      tr.selected {
        background: color-mix(in srgb, var(--paper) 68%, white);
      }

      .clock,
      .small-num {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .pill {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        display: inline-block;
        font-size: 0.78rem;
        min-width: 74px;
        padding: 2px 8px;
        text-align: center;
      }

      .pill.thermal {
        color: var(--thermal);
      }

      .pill.shelly-outgoing {
        color: var(--shelly-out);
      }

      .pill.shelly-incoming {
        color: var(--shelly-in);
      }

      .pill.master {
        color: var(--master);
      }

      .side {
        display: grid;
        gap: 18px;
        min-width: 0;
      }

      .detail {
        min-height: 320px;
        padding: 16px;
      }

      .detail h2 {
        margin-bottom: 4px;
      }

      .detail-meta {
        color: var(--muted);
        font-size: 0.88rem;
        margin-bottom: 12px;
      }

      pre {
        background: #142126;
        border-radius: 6px;
        color: #f7f0df;
        font-size: 0.79rem;
        line-height: 1.45;
        margin: 12px 0 0;
        max-height: 420px;
        overflow: auto;
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .nearest {
        border-top: 1px solid var(--line);
        color: var(--muted);
        margin-top: 12px;
        padding-top: 12px;
      }

      .decisions h2 {
        border-bottom: 1px solid var(--line);
        margin: 0;
        padding: 14px 15px 12px;
      }

      .decision-list {
        max-height: 380px;
        overflow: auto;
      }

      .decision {
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 3px;
        padding: 10px 15px;
        text-align: left;
        width: 100%;
      }

      .decision:last-child {
        border-bottom: 0;
      }

      .decision:hover,
      .decision.selected {
        background: color-mix(in srgb, var(--paper) 68%, white);
      }

      .decision span {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .empty {
        color: var(--muted);
        padding: 20px;
      }

      @media (max-width: 980px) {
        .lower {
          grid-template-columns: 1fr;
        }

        .axis {
          margin-left: 102px;
        }

        .lane {
          grid-template-columns: 102px 1fr;
        }
      }

      @media (max-width: 620px) {
        main {
          padding-top: 18px;
        }

        .window {
          text-align: left;
        }

        .axis {
          margin-left: 0;
        }

        .lane {
          display: block;
        }

        .lane-label {
          border-bottom: 1px solid var(--line);
          border-right: 0;
          display: flex;
          justify-content: space-between;
        }

        input[type="search"] {
          min-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>SmartClaws Demo Timeline</h1>
          <p class="subhead" id="subtitle"></p>
        </div>
        <p class="window" id="window"></p>
      </header>

      <section class="metrics" id="metrics" aria-label="Timeline counts"></section>

      <section class="band">
        <div class="chart-shell">
          <div class="chart-head">
            <h2>Electricity price</h2>
            <div class="legend">
              <span class="key price-key">EUR/MWh</span>
              <span class="key low-key">Low</span>
              <span class="key mid-key">Medium</span>
              <span class="key high-key">High</span>
            </div>
          </div>
          <svg id="price-chart" viewBox="0 0 1200 300" role="img"></svg>
        </div>
      </section>

      <section class="band">
      <section class="band">
        <div class="chart-shell">
          <div class="chart-head">
            <h2>Thermal sensor</h2>
            <div class="legend">
              <span class="key temp-key">Temperature C</span>
            </div>
          </div>
          <svg id="thermal-chart" viewBox="0 0 1200 360" role="img"></svg>
        </div>
      </section>

      <section class="band">
        <div class="timeline-shell">
          <div class="timeline-head">
            <h2>Event lanes</h2>
            <div class="legend">
              <span class="key out-key">Shelly telemetry</span>
              <span class="key in-key">Shelly commands</span>
              <span class="key master-key">Master logs</span>
            </div>
          </div>
          <div id="axis" class="axis"></div>
          <div id="lanes"></div>
        </div>
      </section>
      <section class="band lower">
        <div>
          <div class="timeline-head">
            <h2>Timestamped events</h2>
            <div class="controls">
              <input id="search" type="search" placeholder="Filter events" />
              <label><input class="track-filter" type="checkbox" value="thermal" checked /> Thermal</label>
              <label><input class="track-filter" type="checkbox" value="shelly-outgoing" checked /> Shelly out</label>
              <label><input class="track-filter" type="checkbox" value="shelly-incoming" checked /> Shelly in</label>
              <label><input class="track-filter" type="checkbox" value="master" checked /> Master</label>
            </div>
          </div>
          <div class="table-shell">
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Time</th>
                    <th>Track</th>
                    <th>Message</th>
                    <th>Offset</th>
                  </tr>
                </thead>
                <tbody id="event-rows"></tbody>
              </table>
            </div>
          </div>
        </div>
        <aside class="side">
          <section class="detail" id="detail"></section>
          <section class="decisions">
            <h2>Master decisions</h2>
            <div class="decision-list" id="decisions"></div>
          </section>
        </aside>
      </section>
    </main>

time":"2026-05-20T17:41:44.844203Z"},{"agent":"smartclaws-shelly-master","cycle":54,"level":"ok","message":"cycle complete","next_wake_s":90,"reason":"hold: coasting expensive, T=26.0, floor in 1212s, tier ends in 2426s","stage":"done","ts":"2026-05-20T17:42:33.907467Z","line":112,"timestamp":1779298953.907467,"time":"2026-05-20T17:42:33.907467Z"},{"agent":"smartclaws-shelly-master","cycle":55,"level":"info","message":"cycle started","stage":"start","ts":"2026-05-20T17:44:19.741514Z","line":113,"timestamp":1779299059.741514,"time":"2026-05-20T17:44:19.741514Z"},{"agent":"smartclaws-shelly-master","cycle":55,"level":"ok","message":"cycle complete","next_wake_s":90,"reason":"hold: coasting expensive, T=25.6, floor in 1011s, tier ends 2271s","stage":"done","ts":"2026-05-20T17:44:56.129391Z","line":114,"timestamp":1779299096.129391,"time":"2026-05-20T17:44:56.129391Z"},{"agent":"smartclaws-shelly-master","cycle":56,"level":"info","message":"cycle started","stage":"start","ts":"2026-05-20T17:46:40.183440Z","line":115,"timestamp":1779299200.18344,"time":"2026-05-20T17:46:40.183440Z"},{"agent":"smartclaws-shelly-master","cycle":56,"level":"ok","message":"cycle complete","next_wake_s":90,"reason":"hold: coasting expensive, T=25.3, floor in 858s, tier ends 2131s","stage":"done","ts":"2026-05-20T17:47:20.530089Z","line":116,"timestamp":1779299240.530089,"time":"2026-05-20T17:47:20.530089Z"},{"agent":"smartclaws-shelly-master","cycle":57,"level":"info","message":"cycle started","stage":"start","ts":"2026-05-20T17:49:01.997546Z","line":117,"timestamp":1779299341.997546,"time":"2026-05-20T17:49:01.997546Z"},{"agent":"smartclaws-shelly-master","cycle":57,"level":"ok","message":"cycle complete","next_wake_s":90,"reason":"hold: coasting expensive, T=25.2, floor in 818s, tier ends 1991s","stage":"done","ts":"2026-05-20T17:51:25.214439Z","line":118,"timestamp":1779299485.214439,"time":"2026-05-20T17:51:25.214439Z"},{"agent":"smartclaws-shelly-master","cycle":58,"level":"info","message":"cycle started","stage":"start","ts":"2026-05-20T17:53:27.886074Z","line":119,"timestamp":1779299607.886074,"time":"2026-05-20T17:53:27.886074Z"},{"agent":"smartclaws-shelly-master","cycle":58,"level":"ok","message":"cycle complete","next_wake_s":60,"reason":"hold: T=24.85 near floor, expensive 1710s remaining, time_to_floor=630s","stage":"done","ts":"2026-05-20T17:54:32.135176Z","line":120,"timestamp":1779299672.135176,"time":"2026-05-20T17:54:32.135176Z"},{"agent":"smartclaws-shelly-master","cycle":59,"level":"info","message":"cycle started","stage":"start","ts":"2026-05-20T17:55:47.629598Z","line":121,"timestamp":1779299747.629598,"time":"2026-05-20T17:55:47.629598Z"},{"agent":"smartclaws-shelly-master","cycle":59,"level":"ok","message":"cycle complete","next_wake_s":60,"reason":"hold: T=24.64 dropping toward floor, expensive 1575s, override in ~490s","stage":"done","ts":"2026-05-20T17:56:41.258262Z","line":122,"timestamp":1779299801.258262,"time":"2026-05-20T17:56:41.258262Z"}],"sources":{"smartclawsHome":"/home/user/.sc-controller","masterEventLog":"/home/user/.sc-controller/state/master-events.jsonl","thermal":{"channel":"0x5038Cc8eD9c3dcfB249173423d43074D89F5F010","totalAvailable":122,"oldestOffset":0,"latestOffset":121,"inWindow":122},"shellyOutgoing":{"channel":"0x5fe33a4575eb69ec6416659273c001c0b0ec98c0","totalAvailable":126,"oldestOffset":0,"latestOffset":125,"inWindow":42},"shellyIncoming":{"channel":"0xc7e92dc1d7097ee2bcdcac9c2f6e923b346f1fc6","totalAvailable":9,"oldestOffset":0,"latestOffset":8,"inWindow":8},"masterEvents":{"totalLogLines":122,"inWindow":122},"tariff":{"logPath":"/home/user/.sc-controller/state/tariff-sim.log","snapshotPath":"/home/user/.sc-controller/tariff.json","startedAt":"2026-05-20T15:34:05.561733Z","tierThresholds":{"cheap_max":45.56,"expensive_min":75.07},"timestampBasis":"tariff snapshot config.started_at_iso plus tariff log sim seconds","totalLogSamples":1673,"inWindow":1658}}}</script>
    <script>
      const rawData = JSON.parse(document.getElementById("demo-data").textContent);
      const rootDetail = document.getElementById("detail");

      if (!rawData || typeof rawData !== "object" || !rawData.window) {
        rootDetail.innerHTML =
          '<h2>No embedded demo data</h2><p class="empty">Run dev/build-demo-timeline.py to create the report.</p>';
        throw new Error("No timeline data");
      }

      const data = rawData;
      const priceSamples = data.price || [];
      const priceTiers = data.priceTiers || [];
      const startMs = data.window.startTimestamp * 1000;
      const endMs = data.window.endTimestamp * 1000;
      const spanMs = Math.max(1, endMs - startMs);
      const shortTime = new Intl.DateTimeFormat(undefined, {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
      });
      const fullTime = new Intl.DateTimeFormat(undefined, {
        dateStyle: "medium",
        timeStyle: "medium",
        hourCycle: "h23",
      });
      let selectedId = null;

      function node(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function msFor(event) {
        return event.timestamp * 1000;
      }

      function percent(timestampMs) {
        return Math.max(0, Math.min(100, ((timestampMs - startMs) / spanMs) * 100));
      }

      function durationLabel(seconds) {
        const rounded = Math.round(seconds);
        const hours = Math.floor(rounded / 3600);
        const minutes = Math.floor((rounded % 3600) / 60);
        const rest = rounded % 60;
        return [hours && `${hours}h`, minutes && `${minutes}m`, `${rest}s`]
          .filter(Boolean)
          .join(" ");
      }

      function finiteLabel(value, digits = 2) {
        return Number.isFinite(value) ? value.toFixed(digits) : "-";
      }

      const events = [
        ...data.thermal.map((sample) => ({
          ...sample,
          id: `thermal-${sample.offset}`,
          track: "thermal",
          label: `${finiteLabel(sample.temperatureC)} C, trend ${finiteLabel(sample.trendCPerMin, 3)} C/min`,
          offsetLabel: sample.offset,
          details: {
            temperature_c: sample.temperatureC,
            trend_c_per_min: sample.trendCPerMin,
          },
        })),
        ...data.shellyOutgoing.map((message) => ({
          ...message,
          id: `shelly-outgoing-${message.offset}`,
          track: "shelly-outgoing",
          label: `${message.topic}: ${message.summary}`,
          offsetLabel: message.offset,
          details: message.payload,
        })),
        ...data.shellyIncoming.map((message) => ({
          ...message,
          id: `shelly-incoming-${message.offset}`,
          track: "shelly-incoming",
          label: `${message.topic}: ${message.summary}`,
          offsetLabel: message.offset,
          details: message.payload,
        })),
        ...data.masterEvents.map((event) => ({
          ...event,
          id: `master-${event.line}`,
          track: "master",
          label: `${event.stage || "event"}: ${event.reason || event.message || ""}`,
          offsetLabel: event.cycle ?? "",
          details: event,
        })),
      ].sort((left, right) => left.timestamp - right.timestamp);

      const eventsById = new Map(events.map((event) => [event.id, event]));

      function trackName(track) {
        return {
          thermal: "Thermal",
          "shelly-outgoing": "Shelly out",
          "shelly-incoming": "Shelly in",
          master: "Master",
        }[track];
      }

      function renderHeader() {
        document.getElementById("subtitle").textContent =
          `Window anchored by ${data.thermal.length} thermal telemetry samples with ${priceSamples.length} tariff samples`;
        document.getElementById("window").textContent =
          `${fullTime.format(startMs)} to ${fullTime.format(endMs)} (${durationLabel(data.window.durationSeconds)})`;

        const metrics = [
          [data.thermal.length, "thermal samples"],
          [priceSamples.length, "price samples"],
          [data.shellyOutgoing.length, "Shelly outgoing"],
          [data.shellyIncoming.length, "Shelly incoming"],
          [data.masterEvents.length, "master log events"],
        ];
        const metricRoot = document.getElementById("metrics");
        metrics.forEach(([value, label]) => {
          const metric = node("div", "metric");
          metric.append(node("strong", "", String(value)));
          metric.append(node("span", "", label));
          metricRoot.append(metric);
        });
      }

      function svgElement(tag, attrs) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", tag);
        Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
        return element;
      }

      function seriesPath(points, xScale, yScale) {
        return points
          .map((point, index) => `${index ? "L" : "M"} ${xScale(point)} ${yScale(point)}`)
          .join(" ");
      }

      function paddedRange(values, fallbackPad) {
        const minimum = Math.min(...values);
        const maximum = Math.max(...values);
        const pad = Math.max((maximum - minimum) * 0.12, fallbackPad);
        return [minimum - pad, maximum + pad];
      }

      function renderPriceChart() {
        const chart = document.getElementById("price-chart");
        chart.textContent = "";
        chart.setAttribute(
          "aria-label",
          `Electricity price and tariff tiers from ${data.window.start} to ${data.window.end}`,
        );
        const plot = { left: 72, right: 1128, top: 24, bottom: 248 };
        if (!priceSamples.length) {
          const message = svgElement("text", {
            x: plot.left,
            y: 146,
            class: "chart-axis",
          });
          message.textContent = "No tariff simulator price history was found for this window.";
          chart.append(message);
          return;
        }

        const priceRange = paddedRange(priceSamples.map((sample) => sample.priceEurMwh), 4);
        const x = (sample) =>
          plot.left + percent(sample.timestamp * 1000) * (plot.right - plot.left) / 100;
        const yPrice = (sample) =>
          plot.bottom -
          ((sample.priceEurMwh - priceRange[0]) / (priceRange[1] - priceRange[0])) *
            (plot.bottom - plot.top);

        priceTiers.forEach((tier) => {
          const startX = plot.left + percent(tier.startTimestamp * 1000) * (plot.right - plot.left) / 100;
          const endX = plot.left + percent(tier.endTimestamp * 1000) * (plot.right - plot.left) / 100;
          const block = svgElement("rect", {
            x: startX,
            y: plot.top,
            width: Math.max(1, endX - startX),
            height: plot.bottom - plot.top,
            class: `price-tier ${tier.tierLabel}`,
          });
          const title = svgElement("title", {});
          title.textContent =
            `${tier.tierLabel.toUpperCase()} tariff: avg ${finiteLabel(tier.averagePriceEurMwh)} EUR/MWh, ` +
            `range ${finiteLabel(tier.minPriceEurMwh)}-${finiteLabel(tier.maxPriceEurMwh)}`;
          block.append(title);
          chart.append(block);
        });

        for (let index = 0; index <= 4; index += 1) {
          const ratio = index / 4;
          const rowY = plot.top + ratio * (plot.bottom - plot.top);
          chart.append(
            svgElement("line", {
              x1: plot.left,
              x2: plot.right,
              y1: rowY,
              y2: rowY,
              class: "chart-grid",
            }),
          );
          const value = priceRange[1] - ratio * (priceRange[1] - priceRange[0]);
          const label = svgElement("text", {
            x: plot.left - 10,
            y: rowY + 4,
            "text-anchor": "end",
            class: "chart-axis",
          });
          label.textContent = value.toFixed(0);
          chart.append(label);
        }


        for (let index = 0; index <= 5; index += 1) {
          const ratio = index / 5;
          const markX = plot.left + ratio * (plot.right - plot.left);
          chart.append(
            svgElement("line", {
              x1: markX,
              x2: markX,
              y1: plot.top,
              y2: plot.bottom,
              class: "chart-grid",
            }),
          );
          const label = svgElement("text", {
            x: markX,
            y: plot.bottom + 28,
            "text-anchor": "middle",
            class: "chart-axis",
          });
          label.textContent = shortTime.format(startMs + ratio * spanMs);
          chart.append(label);
        }

        chart.append(
          svgElement("path", {
            d: seriesPath(priceSamples, x, yPrice),
            class: "chart-price",
          }),
        );
        priceSamples.forEach((sample) => {
          const dot = svgElement("circle", {
            cx: x(sample),
            cy: yPrice(sample),
            r: 1.7,
            class: "price-dot",
          });
          const title = svgElement("title", {});
          title.textContent =
            `${fullTime.format(sample.timestamp * 1000)} - ${finiteLabel(sample.priceEurMwh)} EUR/MWh, ` +
            `${sample.tierLabel} tariff`;
          dot.append(title);
          chart.append(dot);
        });
      }

      function renderChart() {
        const chart = document.getElementById("thermal-chart");
        chart.textContent = "";
        chart.setAttribute(
          "aria-label",
          `Thermal temperature from ${data.window.start} to ${data.window.end}`,
        );
        const plot = { left: 72, right: 1128, top: 28, bottom: 306 };
        const tempRange = paddedRange(data.thermal.map((sample) => sample.temperatureC), 0.4);
        const x = (sample) =>
          plot.left + percent(sample.timestamp * 1000) * (plot.right - plot.left) / 100;
        const yTemp = (sample) =>
          plot.bottom -
          ((sample.temperatureC - tempRange[0]) / (tempRange[1] - tempRange[0])) *
            (plot.bottom - plot.top);

        [22, 24, 26].forEach((level) => {
          const levelY = plot.bottom -
            ((level - tempRange[0]) / (tempRange[1] - tempRange[0])) *
              (plot.bottom - plot.top);
          if (levelY < plot.top || levelY > plot.bottom) return;
          chart.append(
            svgElement("line", {
              x1: plot.left,
              x2: plot.right,
              y1: levelY,
              y2: levelY,
              class: "temperature-guide",
            }),
          );
          const label = svgElement("text", {
            x: plot.left + 9,
            y: levelY - 6,
            class: "temperature-guide-label",
          });
          label.textContent = `${level} C`;
          chart.append(label);
        });

        for (let index = 0; index <= 5; index += 1) {
          const ratio = index / 5;
          const rowY = plot.top + ratio * (plot.bottom - plot.top);
          chart.append(
            svgElement("line", {
              x1: plot.left,
              x2: plot.right,
              y1: rowY,
              y2: rowY,
              class: "chart-grid",
            }),
          );
          const tempValue = tempRange[1] - ratio * (tempRange[1] - tempRange[0]);
          const leftText = svgElement("text", {
            x: plot.left - 10,
            y: rowY + 4,
            "text-anchor": "end",
            class: "chart-axis",
          });
          leftText.textContent = `${tempValue.toFixed(1)} C`;
          chart.append(leftText);
        }

        for (let index = 0; index <= 5; index += 1) {
          const ratio = index / 5;
          const markX = plot.left + ratio * (plot.right - plot.left);
          chart.append(
            svgElement("line", {
              x1: markX,
              x2: markX,
              y1: plot.top,
              y2: plot.bottom,
              class: "chart-grid",
            }),
          );
          const label = svgElement("text", {
            x: markX,
            y: plot.bottom + 28,
            "text-anchor": "middle",
            class: "chart-axis",
          });
          label.textContent = shortTime.format(startMs + ratio * spanMs);
          chart.append(label);
        }

        chart.append(
          svgElement("path", {
            d: seriesPath(data.thermal, x, yTemp),
            class: "chart-temp",
          }),
        );
        data.thermal.forEach((sample) => {
          const dot = svgElement("circle", {
            cx: x(sample),
            cy: yTemp(sample),
            r: 3,
            class: "thermal-dot",
          });
          const title = svgElement("title", {});
          title.textContent =
            `${fullTime.format(sample.timestamp * 1000)} - ${finiteLabel(sample.temperatureC)} C`;
          dot.append(title);
          chart.append(dot);
        });
      }

      function renderAxis() {
        const axis = document.getElementById("axis");
        for (let index = 0; index <= 5; index += 1) {
          const ratio = index / 5;
          const mark = node("div", "axis-mark", shortTime.format(startMs + ratio * spanMs));
          mark.style.setProperty("--x", `${ratio * 100}%`);
          axis.append(mark);
        }
      }

      function laneEvents(track) {
        return events.filter((event) => event.track === track);
      }

      function markerFor(event, index) {
        const marker = node(
          "button",
          `marker ${event.track}${event.level === "failed" ? " failed" : ""}`,
        );
        marker.type = "button";
        marker.title = `${fullTime.format(msFor(event))}: ${event.label}`;
        marker.setAttribute("aria-label", marker.title);
        marker.style.setProperty("--x", `${percent(msFor(event))}%`);
        marker.style.setProperty("--y", `${20 + (index % 3) * 15}px`);
        marker.dataset.eventId = event.id;
        marker.addEventListener("click", () => selectEvent(event.id));
        return marker;
      }

      function renderTariffLane(lanes) {
        const lane = node("section", "lane");
        const label = node("div", "lane-label");
        label.append(node("strong", "", "Electricity price"));
        label.append(node("span", "", `${priceTiers.length} tariff tiers`));
        const plot = node("div", "lane-plot");
        if (!priceTiers.length) {
          plot.append(node("p", "empty", "No tariff history in this window."));
        }
        priceTiers.forEach((tier) => {
          const segment = node("div", `tier-segment ${tier.tierLabel}`);
          segment.style.setProperty("--x", `${percent(tier.startTimestamp * 1000)}%`);
          segment.style.setProperty(
            "--w",
            `${Math.max(0.2, percent(tier.endTimestamp * 1000) - percent(tier.startTimestamp * 1000))}%`,
          );
          segment.title =
            `${tier.tierLabel.toUpperCase()} ${shortTime.format(tier.startTimestamp * 1000)}-` +
            `${shortTime.format(tier.endTimestamp * 1000)}: avg ${finiteLabel(tier.averagePriceEurMwh)} EUR/MWh`;
          segment.append(node("strong", "", tier.tierLabel));
          plot.append(segment);
        });
        lane.append(label, plot);
        lanes.append(lane);
      }

      function renderLanes() {
        renderAxis();
        const lanes = document.getElementById("lanes");
        renderTariffLane(lanes);
        [
          ["shelly-outgoing", "Shelly telemetry"],
          ["shelly-incoming", "Shelly commands"],
          ["master", "Master logs"],
        ].forEach(([track, title]) => {
          const trackEvents = laneEvents(track);
          const lane = node("section", "lane");
          const label = node("div", "lane-label");
          label.append(node("strong", "", title));
          label.append(node("span", "", `${trackEvents.length} events`));
          const plot = node("div", "lane-plot");
          trackEvents.forEach((event, index) => plot.append(markerFor(event, index)));
          lane.append(label, plot);
          lanes.append(lane);
        });
      }

      function filterText(event) {
        return `${event.track} ${event.label} ${event.topic || ""} ${event.stage || ""}`.toLowerCase();
      }

      function activeTracks() {
        return new Set(
          [...document.querySelectorAll(".track-filter:checked")].map((input) => input.value),
        );
      }

      function visibleEvents() {
        const query = document.getElementById("search").value.trim().toLowerCase();
        const tracks = activeTracks();
        return events.filter(
          (event) => tracks.has(event.track) && (!query || filterText(event).includes(query)),
        );
      }

      function renderRows() {
        const body = document.getElementById("event-rows");
        body.textContent = "";
        visibleEvents().forEach((event) => {
          const row = node("tr", selectedId === event.id ? "selected" : "");
          row.dataset.eventId = event.id;
          row.append(node("td", "clock", shortTime.format(msFor(event))));
          const trackCell = node("td");
          trackCell.append(node("span", `pill ${event.track}`, trackName(event.track)));
          row.append(trackCell);
          row.append(node("td", "", event.label));
          row.append(node("td", "small-num", String(event.offsetLabel ?? "")));
          row.addEventListener("click", () => selectEvent(event.id));
          body.append(row);
        });
      }

      function nearestThermal(event) {
        if (event.track === "thermal") return null;
        return data.thermal.reduce((nearest, sample) => {
          const delta = Math.abs(sample.timestamp - event.timestamp);
          if (!nearest || delta < nearest.delta) return { sample, delta };
          return nearest;
        }, null);
      }

      function renderDetail(event) {
        rootDetail.textContent = "";
        rootDetail.append(node("h2", "", event.label));
        rootDetail.append(
          node("p", "detail-meta", `${trackName(event.track)} at ${fullTime.format(msFor(event))}`),
        );
        const raw = node("pre", "");
        raw.textContent = JSON.stringify(event.details, null, 2);
        rootDetail.append(raw);
        const nearest = nearestThermal(event);
        if (nearest) {
          const text =
            `Nearest thermal sample: ${finiteLabel(nearest.sample.temperatureC)} C, ` +
            `trend ${finiteLabel(nearest.sample.trendCPerMin, 3)} C/min, ` +
            `${nearest.delta.toFixed(0)}s away.`;
          rootDetail.append(node("p", "nearest", text));
        }
      }

      function syncSelection() {
        document.querySelectorAll("[data-event-id]").forEach((element) => {
          element.classList.toggle("selected", element.dataset.eventId === selectedId);
        });
        document.querySelectorAll(".decision").forEach((element) => {
          element.classList.toggle("selected", element.dataset.eventId === selectedId);
        });
      }

      function selectEvent(id) {
        selectedId = id;
        const event = eventsById.get(id);
        if (event) renderDetail(event);
        renderRows();
        syncSelection();
      }

      function decisionText(event) {
        return event.reason || event.message || `${event.stage || "event"}`;
      }

      function renderDecisions() {
        const decisions = data.masterEvents.filter(
          (event) => event.reason || event.stage === "decision" || event.stage === "done",
        );
        const list = document.getElementById("decisions");
        if (!decisions.length) {
          list.append(node("p", "empty", "No decision events in the window."));
          return;
        }
        decisions.forEach((event) => {
          const id = `master-${event.line}`;
          const button = node("button", "decision");
          button.type = "button";
          button.dataset.eventId = id;
          button.append(node("span", "", `${shortTime.format(event.timestamp * 1000)} cycle ${event.cycle ?? "-"}`));
          button.append(node("strong", "", decisionText(event)));
          button.addEventListener("click", () => selectEvent(id));
          list.append(button);
        });
      }

      renderHeader();
      renderPriceChart();
      renderChart();
      renderLanes();
      renderDecisions();
      renderRows();
      document.getElementById("search").addEventListener("input", renderRows);
      document.querySelectorAll(".track-filter").forEach((input) =>
        input.addEventListener("change", renderRows),
      );
      selectEvent(events.find((event) => event.track === "master")?.id || events[0]?.id);
    </script>
  </body>
</html>
