name: Smart Contracts

on:
  push:
    branches: [main]
    paths:
      - "smart-contracts/**"
  pull_request:
    branches: [main]
    paths:
      - "smart-contracts/**"

jobs:
  test:
    name: Compile, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-contracts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Compile contracts
        run: bun run compile

      - name: Lint Solidity
        run: bun run lint

      - name: Run tests
        run: bun test
