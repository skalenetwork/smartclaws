name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      branch: ${{ steps.meta.outputs.branch }}
      index: ${{ steps.meta.outputs.index }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(jq -r .version package.json)
          BRANCH="${GITHUB_REF_NAME}"

          # Count previous releases matching this version-branch pattern
          INDEX=0
          for tag in $(git tag -l "v${VERSION}-${BRANCH}.*" 2>/dev/null | sort -V); do
            i="${tag##*.}"
            if [ "$i" -ge "$INDEX" ] 2>/dev/null; then
              INDEX=$((i + 1))
            fi
          done

          RELEASE_TAG="v${VERSION}-${BRANCH}.${INDEX}"
          RELEASE_NAME="SmartClaws ${VERSION}-${BRANCH}.${INDEX}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "index=${INDEX}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

  # Gate the release on the full suite. Binaries are only built/published if
  # contracts, packages, and the CLI all pass on this push to main.
  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install contract deps
        working-directory: smart-contracts
        run: bun install

      - name: Compile contracts
        working-directory: smart-contracts
        run: bunx hardhat compile

      - name: Export ABIs
        working-directory: smart-contracts
        run: bash scripts/export-abi.sh

      - name: Contract tests
        working-directory: smart-contracts
        run: bunx hardhat test

      - name: Install workspace deps
        run: bun install

      - name: Lint
        working-directory: packages/cli
        run: bunx biome check src ../sdk/src ../openclaw-plugin/src

      - name: Build packages
        run: bun run build:packages

      - name: Type check core
        working-directory: packages/core
        run: bunx tsc --noEmit

      - name: Type check SDK
        working-directory: packages/sdk
        run: bun run check

      - name: Type check CLI
        working-directory: packages/cli
        run: bun run check

      - name: Type check plugin
        working-directory: packages/openclaw-plugin
        run: bun run check

      - name: SDK tests
        run: bun run test:sdk

      - name: Plugin tests
        working-directory: packages/openclaw-plugin
        run: bun test

      - name: Verify plugin manifest is current
        run: bun run plugin:manifest:check

      - name: Validate OpenClaw plugin
        run: bun run plugin:validate

      - name: CLI unit tests
        working-directory: packages/cli
        run: bun run test:unit

      - name: Start anvil
        run: bash scripts/anvil.sh

      - name: CLI integration tests
        working-directory: packages/cli
        run: bun run test:integration

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-darwin-arm64
            platform: darwin-arm64
          - target: bun-linux-x64
            platform: linux-x86_64
          - target: bun-linux-arm64
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          BINARY_NAME="smartclaws-${{ matrix.platform }}"
          cd packages/cli
          bun build --compile --target=${{ matrix.target }} src/index.ts --outfile "dist/${BINARY_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartclaws-${{ matrix.platform }}
          path: packages/cli/dist/smartclaws-*

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create tag
        run: |
          git tag "${{ needs.prepare.outputs.release_tag }}"
          git push origin "${{ needs.prepare.outputs.release_tag }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: binaries/*
          generate_release_notes: true
